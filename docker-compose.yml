name: monitoring-stack

services:
  api:
    image: hashicorp/http-echo:1.0
    container_name: echo-api
    command:
      - "-listen=:8080"
      - "-text=Monitoring Service Active"
    networks:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    depends_on:
      - api
    ports:
      # Порт на хосте можно поменять: PROXY_PORT=8081 docker compose up -d
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  backend:
    name: monitoring-backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
